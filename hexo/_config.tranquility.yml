cv:
  enable: true
  showInNav: true
  iconPrefix: fas
  keywords: Java开发
  description: YXY的简历
  title: YXY的简历
  content:
    title: YXY
    baseInfo:
      - Java 开发 · 5 年
      - 男 · 汉
      - 本科 · 青岛大学软件工程
      - 在职，期望全职，30 天内到岗
    tel: 1786542****
    email: 1786542****@163.com
    github: 932687738
    edu:
      title: "教育背景"
      content:
        - 2015.09 至 2019.06，青岛大学，软件工程，本科
    chapters:
      - title: 求职意向
        icon:
          name: briefcase
          type: fas
        content:
          - 期望从事 Java 开发，全职。目前在职，可在 30 天内到岗。
      - title: 专业技能
        icon:
          name: code
          type: fas
        list: true
        content:
          - "库存记账：按可用、分配、已拣、冻结分项记账，乐观锁冲突后自动重试。"
          - "检索拆分：在线库承担分配与库存扣减，订单、任务及库存移动检索拆到 Elasticsearch。"
          - "会话与历史：会话上下文放 Redis，公开历史落 MySQL。"
          - "MCP：熟悉 Spring AI MCP 的 Tool 装配。按只读、写入、诊断分包，统一命名、入参 Schema 和副作用标注；身份走请求头，Tool 只转调既有接口并复用数据权限。"
          - "Agent 编排：基于 LangChain4j 做工具调用与 ReAct。Skill 绑定实时工具目录，主控做意图理解与单助理委派；Redis 存会话上下文，MySQL 存公开历史。写操作人工确认后按固定参数执行，身份取自 JWT，并用 Langfuse 追踪调用。"
          - "AI工具：使用 Claude Code、Cursor 编写业务代码。"
          - "中间件：熟练使用RocketMQ处理异步解耦、流量削峰等场景，消息可靠性保障（防丢失、防重复消费）、投递一致性及延迟队列技术"
          - "业务方向：掌握结算、物流、仓储管理等业务，包括入库、出库、加工、盘点，以及工单客服、账单汇总、抛账和提现。"
          - "前端开发：能使用 Vue、React、uni-app 开发；用过 WebSocket 与 React 保持长连接来管理定时任务，也用过浏览器插件处理登录态。"
      - title: 工作经历
        icon:
          name: laptop-code
          type: fas
        sections:
          - title: 百世信息技术有限公司
            description: Java 开发 · 2021.11 至今
            content:
              - 在职期间，所在海外仓储 SaaS 覆盖美国自营仓及东南亚自营仓、加盟仓，日均单量由约 2 万增至约 200 万（业务规模）。本人做了检索拆分、归档和慢 SQL 治理，保障这段增长期间的在线分配与库存扣减。
              - 负责仓储 MCP 接入。把主数据、出入库、工单和订单池规则收口为标准 Tool，统一命名与副作用标注，身份走请求头并复用原有数据权限。
              - 负责实施助理。按 Skill 绑定工具并做意图委派，会话上下文放 Redis、公开历史落 MySQL；规则改写经人工确认后执行，调用链用 Langfuse 追踪。
          - title: 法本信息技术有限公司
            description: Java 开发 · 2020.11 – 2021.11
            content:
              - 负责快递网点共享客服建设，将各快递公司的工单与客服操作收口到同一系统。
              - 已接入韵达、申通，工单日均约十万单，处理效率约为原来的 1.5 倍，客服操作复杂度与培养难度下降约 20%。
              - 负责集团 App 账单汇总、发票核对、抛账与提现。使用计费引擎完成阶梯计费，定时生成月账单和结算单，对接支付宝对外提供提现。
          - title: 北京柯莱特有限公司
            description: Java 开发 · 2018.12 – 2020.11
            content: []
      - title: 项目经验
        icon:
          name: diagram-project
          type: fas
        sections:
          - title: WMS
            description: 海外仓储 SaaS，日均单量约 200 万（业务规模）
            content:
              - "项目背景：面向美国自营仓及东南亚自营仓、加盟仓的国际仓储 SaaS。按仓库与货主隔离，支持多语言、多时区。在职期间日均单量由约 2 万增至约 200 万（业务规模）。"
              - "技术栈：Spring Boot、MySQL、Redis、Elasticsearch、HBase、Hologres。"
              - "核心职责：本人做了检索拆分、归档和慢 SQL 治理，保障这段增长期间的在线分配与库存扣减。"
              - 以任务驱动组织库内作业。收货、上架、拣货、补货、打包均抽象为可领取任务，分配、拣货与承运商通过规则配置，新仓与新货主以配置接入。
              - 库存按可用、分配、已拣、冻结分项记账。变更先记录流水，合并后回写，乐观锁冲突自动重试，保障并发场景下账实一致。订单、任务及库存移动检索迁移至 Elasticsearch，在线库承担分配与库存扣减。
              - 完成数据清洗与归档，持续治理慢 SQL。日结、库存快照与归档按仓库分片，交由独立任务执行。
              - 将订单修订前后快照存储至 HBase。事务内仅写入发件箱，由独立任务批量写入，改单事务与 HBase 写入解耦，在线表仅保留索引。
              - 将库容与效期预警接入 Hologres 数仓。业务侧仅写入触发表，数仓经 ODS 只读消费，分析查询与拣货、发运所在事务库隔离。
              - 建设 MCP 查询入口，供外部 Agent 调用。请求携带应用、域及货主身份，进程内复用既有业务逻辑与数据权限，控制台看板与字典沿用同一套权限体系。
              - 依据作业数据定位瓶颈，将重复需求沉淀为规则与可复用能力。
          - title: WMS 智能实施助理
            description: MCP 工具接入与 Agent 编排
            content:
              - "工具接入：把主数据、出入库、工单和订单池规则收口为 25 个 MCP Tool。按只读、写入、诊断分包，统一命名、入参和副作用标注；身份走请求头，只转调既有接口并复用数据权限。"
              - "任务编排：实施助理按 Skill 绑定实时工具目录，主数据 11 个只读，订单池 13 个工具并覆盖 31 种条件。主控只理解意图并委派一个助理；新工具只换地址和绑定，不写逐工具 Java 包装。"
              - "记忆管理：会话上下文放 Redis，公开历史落 MySQL，会话、消息、附件各五张分表。按会话分区，过期后从历史回载；同会话互斥执行，审批快照独立保存，停止后保留已生成正文。"
              - "评测护栏：仅订单池规则改写需人工确认，同意后按原参数执行，拒绝不调用且不重复执行。身份取自已验签 JWT，模型不能改写用户与仓库。对话用例覆盖 31 种条件，Langfuse 按会话追踪调用。"
          - title: 共享客服
            description: 快递网点客服统一管理
            content:
              - "项目背景：快递网点对客服质量和人数的要求上升，而客服培养难、流动大。系统将各快递公司的客服与工单收口到一处操作。"
              - "技术栈：React、WebSocket。"
              - "核心职责：负责需求管理、功能划分、业务梳理和项目排期。对不同快递公司的接口做动态配置调用，并对返回数据做统一的标准化处理。"
              - 已接入韵达（YUNDA）、申通（STO）的工单和客服人员管理，工单日均约十万单，处理效率约为原来的 1.5 倍，客服操作复杂度与培养难度下降约 20%。
              - 使用前端插件解决登录态获取问题。使用 WebSocket 与 React 保持长连接，集中管理前端定时任务并分布式消费。
          - title: 结算项目
            description: 账单汇总、抛账与提现
            content:
              - "项目背景：汇总集团 App 使用过程中的账单金额并生成账单，核对用户发票信息，按发票把账单抛给对应用户，并在用户收到货款后提供提现。"
              - "技术栈：计费引擎、支付宝。"
              - "核心职责：使用计费引擎对提现对应的计费明细做阶梯计费，定时生成月账单和结算单，对接支付宝对外提供提现，并建设其余基础功能。"

