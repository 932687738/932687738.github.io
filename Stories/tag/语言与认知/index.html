    </div>
    <div class="post__body">
      
      <div class="post-excerpt"><p>两道平行的山谷，中间隔着一道终年不散的浓雾。东谷的人管一种从岩缝里渗出的、银白色的、清凉的液体叫”银液”。他们用陶罐接来，倒进石槽里淬炼新打的刀剑——沾了银液的刀刃会泛起一层淡蓝光晕，削铁如泥。西谷的人也从岩缝里接出一种银白色的、清凉的液体，也叫”银液”。但他们不淬刀，而是用它涂抹墙壁，干了之后墙面会像月光一样柔和地发光，夜晚不用点灯。</p></div>
