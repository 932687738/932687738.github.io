    <div class="post__body">
      
      <div class="post-excerpt"><p>王宫里有一位御厨，人称“全席公”。他每做一道菜，只要尝第一口，就能说出这道菜从选料到出锅每一步的“功劳分”——盐加了几分的滋味、火候给了几分的焦香、料酒浸了几分的去腥。他甚至能倒推：如果这盘东坡肉最终得了九十分，其中“煨煮的前半个时辰”贡献了三十五分，“后半个时辰”贡献了四十分，“最后收汁的片刻”贡献了十五分。</p></div>
